<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IrisToy - Webcam Hand Tracking Game</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Conteneur vidéo webcam (effet miroir) -->
      <div id="video-container">
        <video id="webcam" playsinline autoplay muted></video>
        <div id="pixi-container"></div>
      </div>

      <!-- Interface utilisateur (HUD & Commandes) -->
      <header id="hud-header">
        <div class="logo-title">
          <span class="iris-badge">🔴 LIVE</span>
          <h1>IrisToy</h1>
        </div>

        <!-- Compteur de Score Central -->
        <div id="hud-score-board" class="score-board">
          <div class="score-main">
            <span class="score-label">REBONDS</span>
            <span id="stat-score" class="score-value">0</span>
          </div>
          <div class="score-sub">
            <span>RECORD : </span>
            <strong id="stat-best">0</strong>
          </div>
        </div>

        <div class="hud-stats">
          <div class="stat-pill" id="stat-fps">FPS: --</div>
          <div class="stat-pill" id="stat-hands">Mains: 0</div>
          <button id="btn-toggle-skeleton" class="btn-pill" title="Touche 'D'">
            Squelette: ON
          </button>
          <button id="btn-toggle-pause" class="btn-pill" title="Touche 'P' ou Espace">
            ⏸ Pause
          </button>
        </div>
      </header>

      <!-- Écran Game Over -->
      <div id="gameover-screen" class="overlay-modal hidden">
        <div class="modal-card">
          <div class="gameover-icon">💥</div>
          <h2>Balle perdue !</h2>
          <p class="gameover-summary">
            Vous avez réalisé <strong id="gameover-score">0</strong> rebonds consécutifs !
            <br />
            Meilleur record : <strong id="gameover-best">0</strong>
          </p>
          <button id="btn-restart-game" class="btn-primary">Rejouer (R / Espace)</button>
        </div>
      </div>

      <!-- Panneau d'accueil / Erreur d'accès caméra -->
      <div id="overlay-screen" class="overlay-modal hidden">
        <div class="modal-card">
          <h2 id="modal-title">Accès à la caméra requis</h2>
          <p id="modal-message">
            IrisToy utilise votre webcam pour détecter vos mains et vos gestes en temps réel directement dans votre navigateur.
          </p>
          <button id="btn-request-camera" class="btn-primary">Autoriser la caméra</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
